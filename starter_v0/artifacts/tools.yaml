# starter_v0 — tool declarations (v2: improved descriptions for better routing).
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Ask the user for missing information before proceeding.
      Use this tool when:
      - The user asks about someone's tweets/posts but doesn't specify the account handle.
      - The user asks to read/summarize a URL but no URL is provided.
      - The user wants to send/publish something — always confirm with response_type="yes_no" first.
      Do NOT guess or assume missing values. Always ask.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "The question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected response type: 'text' for open answer, 'yes_no' for confirmation, 'choice' for options"}
        options: {type: array, default: [], items: {type: string}, description: "List of choices when response_type is 'choice'"}
      required: [question]

  - name: timeline
    description: >
      Get recent posts/tweets from a specific social media account.
      Use when the user asks for tweets or posts FROM a specific person.
      'screenname' is the Twitter/X handle without the @ symbol (e.g. "elonmusk", "sama").
      Known name mappings: Sam Altman -> sama, Elon Musk -> elonmusk.
      If user gives a name but no handle and it's not a well-known mapping, use clarify to ask.
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter handle without @, e.g. 'sama' for Sam Altman"}
        limit: {type: integer, default: 5, description: "Number of posts to fetch"}
      required: [screenname]

  - name: social_search
    description: >
      Search social media posts by keyword or topic.
      Use when the user wants to find posts ABOUT a topic (not from a specific account).
      For 'search_type': use 'Top' when user wants popular/trending posts, 'Latest' for recent posts.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keywords — use the user's exact words only"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'Latest' for recent posts, 'Top' for popular/trending posts"}
        limit: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: lookup
    description: >
      Search the web for information.
      Use when the user wants news, general information, or web results.
      IMPORTANT: 'query' must contain ONLY the user's exact search keywords — do NOT add topic, timeframe, or category words to the query field.
      Use 'topic' param separately: set topic="news" for news/current events, topic="general" for other queries.
      Use 'timeframe' param to set time range: "day" for today's news, "week" for this week, etc.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Exact search keywords from user — no extra words added. E.g. for 'AI news today' use query='AI' with topic='news' and timeframe='day'"}
        topic: {type: string, enum: [general, news], default: "general", description: "Use 'news' for news/current events, 'general' for other searches"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Time range: 'day' for today, 'week' for this week"}
        max_results: {type: integer, default: 5, description: "Number of results"}
      required: [query]

  - name: fetch
    description: >
      Read and extract content from a specific URL.
      Use ONLY when the user provides an explicit URL.
      If no URL is given, use clarify to ask for it first.
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "The full URL to fetch content from"}
      required: [url]

  - name: format
    description: "Format and present a list of collected items as a structured markdown digest."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of items to format"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output template style"}
        headline: {type: string, default: "", description: "Optional headline/title"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >
      Send a text message to Telegram.
      IMPORTANT: You MUST call clarify(response_type="yes_no") to get user confirmation BEFORE calling this tool.
      Never call send without explicit user confirmation. Set confirmed=true only after the user confirms yes.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "The text content to send"}
        confirmed: {type: boolean, default: false, description: "Must be true — only set after user confirms via clarify(yes_no)"}
      required: [text]

  - name: policy
    description: "Search internal company policy documents."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy category"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: papers
    description: "Search for scientific papers on arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search keywords"}
        max_results: {type: integer, default: 5, description: "Number of results"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort order"}
      required: [query]

  - name: paper_text
    description: "Download and extract text from an arXiv paper PDF."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv URL or paper ID"}
        max_pages: {type: integer, default: 5, description: "Maximum pages to extract"}
        max_chars: {type: integer, default: 8000, description: "Maximum characters"}
      required: [arxiv_url]
